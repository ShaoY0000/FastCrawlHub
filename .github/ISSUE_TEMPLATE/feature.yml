name: 功能建议
description: 描述使用场景和希望改善的工作流
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请先描述场景，而不是只给出解决方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的使用方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方式

